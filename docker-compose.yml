services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
      MARIADB_DATABASE: it_repair
      MARIADB_USER: it_repair_app
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build:
      context: ./it-repair-system-backend
    image: 192.168.200.253:5000/it-repair-backend:2.0
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: production
      CLIENT_ORIGIN: http://192.168.200.253:5173
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: it_repair_app
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      DB_NAME: it_repair
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      JWT_EXPIRES_IN: 8h
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./it-repair-system-frontend
    image: 192.168.200.253:5000/it-repair-frontend:2.1
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mariadb_data: